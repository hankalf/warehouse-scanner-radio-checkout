# Render Blueprint — provisions the app + a PostgreSQL database.
# In Render: New → Blueprint → connect this repo → Apply.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: warehouse-device-checkout
    runtime: node
    plan: starter
    region: oregon
    # --include=dev ensures build-only tools (TypeScript, Tailwind) are present
    # even though Render sets NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    # Applies migrations, seeds the fleet, then serves. Render provides PORT.
    startCommand: npm run start:prod
    healthCheckPath: /kiosk
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: device-db
          property: connectionString
      - key: NODE_VERSION
        value: "22"
      # Timezone for logged times and Teams messages. Change this to the
      # warehouse's local zone (IANA name).
      - key: TZ
        value: "America/New_York"

databases:
  - name: device-db
    plan: basic-256mb
    region: oregon
    databaseName: devicedb
    user: device
